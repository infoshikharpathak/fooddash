services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - INTERNAL_BASE_URL=http://localhost:8000
      - AUTO_TRAFFIC=true
      - TRAFFIC_RPS=3
    volumes:
      - /tmp:/tmp

  dashboard:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - FOODDASH_API_URL=http://app:8000
    depends_on:
      - app
