name: CI

# No test suite yet — this is an honest smoke check, not a "tests passing"
# claim: verifies the dependencies install cleanly and the FastAPI app
# module imports without error on a fresh environment (catches import
# errors and route-registration bugs without needing a live Redis).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import smoke test
        run: python -c "import main; print('fooddash app imports cleanly')"
